[project]
name = "ppii-s5"
version = "1.0.0"
description = "PPII S5 - Application de gestion (utilisateurs / intervenants / projets)"
requires-python = ">=3.10"
dependencies = [
  "Flask>=2.0",
  "Flask-SQLAlchemy>=3.0",
  "python-dotenv>=0.20",
  "pytest>=7.0",
  "pytest-flask>=1.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app"]
exclude = ["instance"]
