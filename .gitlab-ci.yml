stages:
  - test

test_job:
  stage: test
  image: python:3.10  

  variables:

    DB_HOST: "db"
    DB_USER: "testuser"
    DB_PASSWORD: "testpass"
    DB_NAME: "testdb"


  before_script:
    - python --version
    - pip install -r requirements.txt
    - pip install pytest 

  script:
    - pytest