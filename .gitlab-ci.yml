stages:
  - test
  - build

image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  DOCKER_TLS_CERTDIR: ""

test_job:
  stage: test
  before_script:
  script:
    - docker-compose up -d
    - docker-compose exec -T web pytest tests/
  after_script:
    - docker-compose down

build_job:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main