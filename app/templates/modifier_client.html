{% extends "base.html" %}
{% block title %}Modifier Client{% endblock %}

{% block content %}
<div class="container fade-in">
    <h1>Modifier le Client</h1>
    <p class="text-muted">Édition de : {{ client.raison_sociale }}</p>

    <div class="card" style="max-width: 600px; margin: 30px auto;">
        <form method="POST">

            <div class="form-group">
                <label>Raison Sociale (Nom)</label>
                <input type="text" name="raison_sociale" value="{{ client.raison_sociale }}" required>
            </div>

            <div class="form-group">
                <label>Secteur d'activité</label>
                <input type="text" name="secteur" value="{{ client.secteur }}">
            </div>

            <div class="form-group">
                <label>Email Contact</label>
                <input type="email" name="mail_client" value="{{ client.mail_client }}">
            </div>

            <div class="form-group">
                <label>Téléphone</label>
                <input type="text" name="telephone_client" value="{{ client.telephone_client }}">
            </div>

            <div style="margin-top: 25px; display: flex; gap: 10px;">
                <a href="{{ url_for('clients.details_client', id=client.id_client) }}" class="btn btn-secondary" style="flex: 1; text-align: center;">Annuler</a>
                <button type="submit" class="btn" style="flex: 1;">Enregistrer</button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
