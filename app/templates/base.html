<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}{% endblock %} - PPII</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/svg" href="{{ url_for('static', filename='images/tns_logo.svg') }}">
</head>

<body>



<header class="site-header">
  <nav class="navbar">
    <a class="brand" href="{{ url_for('dashboard.dashboard') }}">
      <img src="{{ url_for('static', filename='images/tns_logo.svg') }}" height="38" style="vertical-align:middle;">
      Telecom Nancy Services
    </a>

    <ul class="nav-list">
      <li><a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a></li>
      <li><a href="{{ url_for('intervenants.liste_intervenants') }}">Intervenants</a></li>
      <li><a href="{{ url_for('clients.liste_clients') }}">Clients</a></li>
      <li><a href="{{ url_for('projets.liste_projets') }}">Projets</a></li>
      <li><a href="{{ url_for('interactions.liste_interactions') }}">Interactions</a></li>
      <li><a href="{{ url_for('intervenants.exporter_intervenants') }}">Export CSV</a></li>
      <li><a href="{{ url_for('map.map_page') }}">Carte des prospects</a></li>
    </ul>
  </nav>
</header>

<div class="container">
  {% block content %}{% endblock %}
</div>

<footer class="site-footer">
  <p>© {{ current_year }} Pôle FWFTNS, C'est nous les meilleurs!</p>
</footer>

<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
