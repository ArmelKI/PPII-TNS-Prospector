{% extends "base.html" %}
{% block title %}Clients{% endblock %}


{% block content %}
<h1 class="fade-in">Clients</h1>

<a href="#" class="btn" style="margin-bottom:20px;">Ajouter un client</a>

<table class="data-table fade-in">
  <tr>
    <th>Nom</th>
    <th>Contact</th>
    <th>Actions</th>
  </tr>

  {% for c in clients %}
  <tr>
    <td>{{ c.raison_sociale }}</td>
    <td>{{ c.mail_client }}</td>
    <td>
      <button class="btn">Voir</button>
    </td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
