{% extends "base.html" %}
{% block title %}Ajouter un intervenant{% endblock %}

{% block content %}
<div class="card">
  <h1>Ajouter un intervenant</h1>

  <form method="POST">
    <label>Associer un utilisateur existant (optionnel)</label>
    <select name="id_utilisateur">
      <option value="">-- Nouveau utilisateur --</option>
      {% for u in utilisateurs %}
        <option value="{{ u.id_utilisateur }}">{{ u.nom_utilisateur }} {{ u.prenom_utilisateur }} — {{ u.mail_utilisateur }}</option>
      {% endfor %}
    </select>

    <hr>

    <label>Prénom</label>
    <input type="text" name="prenom_utilisateur" placeholder="Anne Clair">

    <label>Nom</label>
    <input type="text" name="nom_utilisateur" placeholder="Heutel">

    <label>Email</label>
    <input type="email" name="email_utilisateur" placeholder="anne-claire@example.com">

    <label>Compétences (séparées par ; ou ,)</label>
    <input type="text" name="competences">

    <label>Disponible</label>
    <input type="checkbox" name="disponible">

    <label>Heures disponibles</label>
    <input type="number" step="0.5" name="heures" value="0">

    <button type="submit" class="btn">Enregistrer</button>
    <a href="{{ url_for('intervenants.liste_intervenants') }}" class="btn-secondary">Annuler</a>
  </form>
</div>
{% endblock %}
