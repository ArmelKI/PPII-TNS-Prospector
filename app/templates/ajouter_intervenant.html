{% extends "base.html" %}
{% block title %}Nouvel Intervenant{% endblock %}

{% block content %}
<div class="container fade-in">
  <h1>Nouvel Intervenant</h1>

  <div class="panel">
    <form method="POST" enctype="multipart/form-data" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">

      <div>
        <h3 class="panel-title">👤 Identité & Connexion</h3>

        <div class="form-group">
          <label>Lier à un utilisateur existant (Optionnel)</label>
          <select name="id_utilisateur">
            <option value="">-- Créer un nouvel utilisateur --</option>
            {% for u in utilisateurs %}
              <option value="{{ u.id_utilisateur }}">{{ u.nom_utilisateur }} {{ u.prenom_utilisateur }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Prénom *</label>
          <input type="text" name="prenom_utilisateur" placeholder="ex : Thomas">
        </div>
        <div class="form-group">
          <label>Nom *</label>
          <input type="text" name="nom_utilisateur" placeholder="ex : Anderson">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" name="email_utilisateur" placeholder="thomas.anderson@tns.fr">
        </div>

        <h3 class="panel-title" style="margin-top: 20px;">🎓 Compétences</h3>
        <div class="form-group">
          <label>(Tags,Note/10) (séparés par des points-virgules)</label>
          <input type="text" name="competences" placeholder="(Python,8); (Gestion de projet,10); (Figma,3)">
        </div>
      </div>

      <div>
        <h3 class="panel-title">📄 Statut & Documents</h3>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 10px; border-radius: 5px;">
          <input type="checkbox" name="disponible" id="dispo" checked style="width: auto;">
          <label for="dispo" style="margin:0; cursor:pointer;">Actuellement disponible</label>
        </div>

        <div class="form-group">
          <label>Heures disponibles / semaine</label>
          <input type="number" name="heures" value="10">
        </div>

        <div class="form-group">
          <label>CV (PDF) <span style="color:red">*</span></label>
          <input type="file" name="cv_file" accept=".pdf" required>
        </div>

        <div class="form-group">
          <label>Photo d'identité <span style="color:red">*</span></label>
          <input type="file" name="photo_file" accept="image/*" required>
        </div>

        <div class="form-group">
          <label>Carte étudiante</label>
          <input type="file" name="carte_etu_file">
        </div>

        <div class="form-group">
          <label>Carte Vitale</label>
          <input type="file" name="carte_vitale_file">
        </div>
      </div>

      <div style="grid-column: 1 / -1; margin-top: 20px; text-align: right;">
        <a href="{{ url_for('intervenants.liste_intervenants') }}" class="btn btn-secondary">Annuler</a>
        <button type="submit" class="btn">Enregistrer l'intervenant</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
