{% extends "base.html" %}
{% block title %}Modifier Intervenant{% endblock %}

{% block content %}
<h1>Modifier Intervenant</h1>

<form method="POST">
  <label>Disponible</label>
  <input type="checkbox" name="disponible" {% if intervenant.disponible_actuellement %}checked{% endif %}>

  <label>Heures disponibles</label>
  <input type="number" step="0.5" name="heures" value="{{ intervenant.nombre_heures_disponibles or 0 }}">

  <label>Compétences (séparées par ;)</label>
  <input type="text" name="competences" value="{{ competences_str }}">

  <button type="submit" class="btn">Enregistrer</button>
  <a href="{{ url_for('intervenants.details_intervenant', id=intervenant.id_intervenant) }}" class="btn-secondary">Annuler</a>
</form>
{% endblock %}
