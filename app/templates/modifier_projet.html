{% extends "base.html" %}
{% block title %}Edit Project{% endblock %}

{% block content %}
<div class="container fade-in">
    <h1>Edit Project</h1>
    <p class="text-muted">Editing: {{ projet.nom_projet }}</p>

    <div class="panel">
        <form method="POST" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">

            <div>
                <h3 class="panel-title">📝 Information</h3>

                <div class="form-group">
                    <label>Project Name</label>
                    <input type="text" name="nom_projet" value="{{ projet.nom_projet }}" required>
                </div>

                <div class="form-group">
                    <label>Client</label>
                    <input type="text" value="{{ projet.convention.client.raison_sociale }}" disabled style="background-color: #eee;">
                    <small class="text-muted">Client cannot be modified here.</small>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="statut_projet">
                        {% for s in StatutProjet %}
                            <option value="{{ s.value }}" {% if projet.statut_projet == s %}selected{% endif %}>
                                {{ s.value }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" name="date_debut" value="{{ projet.date_debut_projet }}">
                </div>

                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" name="date_fin" value="{{ projet.date_fin_projet }}">
                </div>
            </div>

            <div>
                <h3 class="panel-title">👥 Team Assignment</h3>
                <div style="max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px;">
                    {% for i in intervenants %}
                    <div style="display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid #f0f0f0;">
                        <input type="checkbox" name="intervenants" value="{{ i.id_intervenant }}" id="int_{{ i.id_intervenant }}"
                            {% if i in projet.intervenants %}checked{% endif %}>

                        <label for="int_{{ i.id_intervenant }}" style="margin:0; cursor:pointer;">
                            <strong>{{ i.utilisateur.prenom_utilisateur }} {{ i.utilisateur.nom_utilisateur }}</strong><br>
                            <small class="text-muted">
                                {% for c in i.competences %}{{ c.nom_competence }} {% endfor %}
                            </small>
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div style="grid-column: 1 / -1; margin-top: 20px; text-align: right;">
                <a href="{{ url_for('projets.details_projet', id=projet.id_projet) }}" class="btn btn-secondary">Cancel</a>   <!-- TODO: need to be translated -->
                <button type="submit" class="btn">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
