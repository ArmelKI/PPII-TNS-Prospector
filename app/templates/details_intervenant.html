{% extends "base.html" %}
{% block title %}Détails de l'Intervenant{% endblock %}
{% block content %}

<div class="container">
  <h1>Détails de l'Intervenant</h1>

  <div class="card">
    <h2>{{ intervenant.nom }}</h2>
    <p><strong>Compétences :</strong> {{ intervenant.competences }}</p>
    <p>
      <strong>Disponibilité :</strong>
      <span class="badge {{ 'green' if intervenant.disponibilite == 'Disponible' else 'red' }}">
        {{ intervenant.disponibilite }}
      </span>
    </p>
  </div>

    <div style="margin-top: 20px;">
        <a href="{{ url_for('intervenants.modifier_intervenant', id=intervenant.id) }}" class="btn">✏️ Modifier</a>
        
        <form method="POST" action="{{ url_for('intervenants.supprimer_intervenant', id=intervenant.id) }}" class="delete-form" style="display:inline;" onsubmit="return confirmDelete();">
        <button type="submit" class="delete">🗑 Supprimer</button>
        </form>
        
        <a href="{{ url_for('intervenants.liste_intervenants') }}" class="btn-secondary">⬅ Retour</a>
    </div>
</div>

{% endblock %}
