{% extends "base.html" %}
{% block title %}Carte des prospects{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
        <script src="../static/js/map.js"></script>
        <link rel="stylesheet" href="../static/css/map.css">
    
</head>
<body onload="init()"> <!-- nécessaire pour que la div qui contient la map existe avant de l'appeller dans le js-->
    <h1>
        Vos prospects
    </h1>
    <label for="radius">Rayon (mètres) :</label>
    <input type="number" id="radius" value="500" min="100" step="100">
    <button onclick="loadProspects()">Mettre à jour le rayon</button>
    <div id="map-legend">
    <div class="legend-item">
        <span class="legend-color client"></span> Client
    </div>
    <div class="legend-item">
        <span class="legend-color prospect"></span> Prospect OSM
    </div>
    <div class="legend-item">
        <span class="legend-color radius"></span> Rayon de recherche
    </div>
    </div>
    <div id="mapid"></div>
    <div><em>&copy; OpenStreetMap contributors</em></div>
    
</body>
</html>
{% endblock %}
