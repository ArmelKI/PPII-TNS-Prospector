{% extends "base.html" %}
{% block title %}Carte des prospects{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
<script src="{{ url_for('static', filename='js/map.js') }}"></script>

<h1>Vos prospects</h1>

<div class="controls" style="margin-bottom: 10px;">
    <label for="radius">Rayon (mètres) :</label>
    <input type="number" id="radius" value="500" min="100" step="100">
    <button onclick="loadProspects()">Mettre à jour le rayon</button>
</div>

<div id="map-legend">
    <div class="legend-item">
        <img src="../static/images/client.svg" class="legend-icon" alt="Client">
        <span>Client</span> 
    </div>
    <div class="legend-item">
        <img src="../static/images/prospect.png" class="legend-icon" alt="Prospect">
        <span>Prospect OSM</span> 
    </div>
</div>

<div id="mapid"></div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        init();
    });
</script>
{% endblock %}
