{% extends "base.html" %}
{% block title %}Nouveau Projet{% endblock %}
{% block content %}
<h1 class="text-center mb-20">Nouveau Projet</h1>

<div class="card form-card-centered">
    <form method="POST">
        
        <label class="form-label-block">Client</label>
        <select name="id_client" required class="form-control">
            {% for c in clients %}
            <option value="{{ c.id_client }}" {% if c.id_client == selected_client %}selected{% endif %}>
                {{ c.raison_sociale }}
            </option>
            {% endfor %}
        </select>

        <label class="form-label-block">Nom du projet</label>
        <input type="text" name="nom_projet" placeholder="Ex: Refonte Site Web" required class="form-control">

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label class="form-label-block">Budget (€)</label>
                <input type="number" name="prix" value="5000" class="form-control">
            </div>
            <div style="flex: 1;">
                <label class="form-label-block">Charge Estimée (Heures)</label>
                <input type="number" name="charge_projet" value="50" class="form-control" required>
                <small class="text-muted">Indispensable pour le calcul IA</small>
            </div>
        </div>

        <div class="form-group mt-15">
            <label class="form-label-block">Compétences requises</label>
            <div class="scrollable-list-box">
                {% for c in competences %}
                <div class="checkbox-item">
                    <input type="checkbox" name="competences_requises" value="{{ c.id_competence }}" id="comp_{{ c.id_competence }}">
                    <label for="comp_{{ c.id_competence }}">{{ c.nom_competence }}</label>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="form-divider-section">
            <label class="form-label-block mb-10">Type de convention :</label>
            <label class="radio-label">
                <input type="radio" name="type_convention" value="CC" checked> Convention Cadre (Standard)
            </label>
            <label class="radio-label">
                <input type="radio" name="type_convention" value="CE"> Convention d'Étude
            </label>
        </div>

        <button type="submit" class="btn w-100">Créer le projet</button>
    </form>
</div>
{% endblock %}
