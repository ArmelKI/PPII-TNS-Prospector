{% extends "base.html" %}
{% block title %}Nouveau Projet{% endblock %}
{% block content %}
<h1>Nouveau Projet</h1>
<div class="card" style="max-width: 600px; margin:auto;">
    <form method="POST">
        <label>Client</label>
        <select name="id_client" required>
            {% for c in clients %}
            <option value="{{ c.id_client }}" {% if c.id_client == selected_client %}selected{% endif %}>
                {{ c.raison_sociale }}
            </option>
            {% endfor %}
        </select>

        <label>Nom du projet</label>
        <input type="text" name="nom_projet" placeholder="Ex: Refonte Site Web" required>

        <label>Budget prévisionnel (€)</label>
        <input type="number" name="prix" value="5000">

        <button type="submit" class="btn">Créer le projet</button>
    </form>
</div>
<div class="form-group" style="margin: 15px 0;">
    <label>Type de convention :</label><br>
    <label style="display:inline-flex; align-items:center; gap:5px; margin-right:15px; font-weight:normal;">
        <input type="radio" name="type_convention" value="CC" checked> Convention Cadre (Standard)
    </label>
    <label style="display:inline-flex; align-items:center; gap:5px; font-weight:normal;">
        <input type="radio" name="type_convention" value="CE"> Convention d'Étude
    </label>
</div>
{% endblock %}
