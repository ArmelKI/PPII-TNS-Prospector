{% extends "base.html" %}
{% block title %}Nouveau Client{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto;">
    <h1>Nouveau Client</h1>
    <form method="POST">
        <div class="form-group">
            <label>Raison Sociale (Nom de l'entreprise)</label>
            <input type="text" name="raison_sociale" required placeholder="Ex: Google France">
        </div>

        <div class="form-group">
            <label>Secteur d'activité</label>
            <input type="text" name="secteur" placeholder="Ex: Informatique, BTP, Santé...">
        </div>

        <div class="form-group">
            <label>Email contact</label>
            <input type="email" name="mail_client" placeholder="contact@entreprise.com">
        </div>

        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" name="telephone_client" placeholder="01 02 03 04 05">
        </div>

        <div style="margin-top:20px;" class="vertical-btn"">
            <a href="{{ url_for('clients.liste_clients') }}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn">Enregistrer le client</button>
        </div>
    </form>
</div>
{% endblock %}
