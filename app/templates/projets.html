{% extends "base.html" %}
{% block title %}Projets{% endblock %}

{% block content %}
<h1 class="fade-in">Projets</h1>

<a href="#" class="btn" style="margin-bottom:20px;">Nouveau projet</a>

<div class="cards fade-in">
  {% for p in projets %}
  <div class="card">
    <h2>{{ p.nom_projet }}</h2>
    <p>{{ p.description_projet }}</p>
    <a class="btn-secondary">Détails</a>
  </div>
  {% endfor %}
</div>

{% endblock %}
