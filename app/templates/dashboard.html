{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h1 class="fade-in">Tableau de bord</h1>

<div class="cards fade-in">
  <div class="card card-blue">
    <div class="icon">👤</div>
    <h2>Intervenants</h2>
    <div class="big">{{ total_intervenants }}</div>
  </div>

  <div class="card card-green">
    <div class="icon">🏢</div>
    <h2>Clients</h2>
    <div class="big">{{ total_clients }}</div>
  </div>

  <div class="card card-orange">
    <div class="icon">📂</div>
    <h2>Projets</h2>
    <div class="big">{{ total_projets }}</div>
  </div>
</div>

<div class="chart-container fade-in">
  <canvas id="projetsChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    new Chart(document.getElementById("projetsChart"), {
      type: "bar",
      data: {
        labels: {{ projets_labels | safe }},
        datasets: [{
          label: "Projets par mois",
          data: {{ projets_counts | safe }}
        }]
      }
    });
  });
</script>

{% endblock %}
