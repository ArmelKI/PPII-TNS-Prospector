{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1>Tableau de bord</h1>

<div class="cards">
  <div class="card card-blue">
    <div class="icon"><i class="fa-solid fa-user-group"></i></div>
    <h2>Clients</h2>
    <div class="big" data-count="{{ nb_clients }}">0</div>
  </div>

  <div class="card card-green">
    <div class="icon"><i class="fa-solid fa-diagram-project"></i></div>
    <h2>Projets</h2>
    <div class="big" data-count="{{ nb_projets }}">0</div>
  </div>

  <div class="card card-orange">
    <div class="icon"><i class="fa-solid fa-people-line"></i></div>
    <h2>Intervenants</h2>
    <div class="big" data-count="{{ nb_intervenants }}">0</div>
  </div>
</div>

<!-- Conteneur du graphique -->
<div class="chart-container">
  <canvas id="statsChart"></canvas>
</div>
{% endblock %}
